<script>
const $=id=>document.getElementById(id);
try{if(window.self!==window.top)$('homeLink').classList.add('hide')}catch(e){$('homeLink').classList.add('hide')}
const toBn=s=>String(s).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const num=s=>{s=String(s||'').trim().replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace('।','.');const v=parseFloat(s);return isNaN(v)?0:v};
const cv=$('cv'),cx=cv.getContext('2d');let dpr=window.devicePixelRatio||1;
let lines=[],plots={},names={},nameP={},texts=[],V={x:0,y:0,k:1},mode='draw',cur=null,sel=-1,selPlot=null,selText=-1,sheetMode='line';
let hist=[],lbl=[],C={},dangling=[];
const pointers=new Map();let g=null,panS=null,multi=false,drag=null,hold=null,raf=0;
const clampK=k=>Math.max(.15,Math.min(10,k));
const T2=Math.PI*2;

function colors(){const cs=getComputedStyle(document.documentElement),q=n=>cs.getPropertyValue(n).trim();
 C={pen:q('--pen')||'#222',hl:q('--hl')||'#d9480f',card:q('--card')||'#fff',ac:q('--ac')||'#2f7d3a'}}
function req(){if(!raf)raf=requestAnimationFrame(draw)}
function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);req()}
const W=p=>[(p[0]-V.x)/V.k,(p[1]-V.y)/V.k];
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

/* ---------- জ্যামিতি: সোজা লাইন ও বৃত্তচাপ (s = জ্যা থেকে চাপের মাঝের দূরত্ব) ---------- */
function arcInfo(l){const s=l.s||0,dx=l.x2-l.x1,dy=l.y2-l.y1,len=Math.hypot(dx,dy);
 if(!len||Math.abs(s)<.5)return null;
 const nx=-dy/len,ny=dx/len,mx=(l.x1+l.x2)/2,my=(l.y1+l.y2)/2,c=len/2,as=Math.abs(s),sg=s>0?1:-1;
 const R=(c*c+s*s)/(2*as),Mx=mx+nx*s,My=my+ny*s,Cx=Mx-nx*sg*R,Cy=My-ny*sg*R;
 const a0=Math.atan2(l.y1-Cy,l.x1-Cx),a1=Math.atan2(l.y2-Cy,l.x2-Cx),am=Math.atan2(My-Cy,Mx-Cx),md=v=>((v%T2)+T2)%T2;
 let dir=1,sw=md(a1-a0);if(md(am-a0)>sw){dir=-1;sw=md(a0-a1)}
 return{Cx,Cy,R,a0,dir,sw,Mx,My,nx,ny,mx,my,sg}}
function samples(l,n=32){const a=arcInfo(l),o=[];
 for(let i=0;i<=n;i++){const t=i/n;if(a){const an=a.a0+a.dir*a.sw*t;o.push([a.Cx+a.R*Math.cos(an),a.Cy+a.R*Math.sin(an)])}
  else o.push([l.x1+(l.x2-l.x1)*t,l.y1+(l.y2-l.y1)*t])}
 if(o.length){o[0]=[l.x1,l.y1];o[n]=[l.x2,l.y2]}return o}
function lineMid(l){const a=arcInfo(l);return a?[a.Mx,a.My]:[(l.x1+l.x2)/2,(l.y1+l.y2)/2]}
function segDist(p,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((p[0]-x1)*dx+(p[1]-y1)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p[0]-(x1+t*dx),p[1]-(y1+t*dy))}
function lineDist(p,l){if(!arcInfo(l))return segDist(p,l.x1,l.y1,l.x2,l.y2);
 const q=samples(l,28);let m=1e9;for(let i=1;i<q.length;i++)m=Math.min(m,segDist(p,q[i-1][0],q[i-1][1],q[i][0],q[i][1]));return m}

const vkey=(x,y)=>Math.round(x*100)+','+Math.round(y*100);
function cycArea(poly){let a=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)a+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]);return Math.abs(a/2)}
function allCycles(c,ek,segs){
 if(c.length>40||c.length<2)return [];
 const adj={};for(const i of c){const[a,b]=ek[i];if(a===b)continue;(adj[a]=adj[a]||[]).push([i,b]);(adj[b]=adj[b]||[]).push([i,a])}
 let best=[],cnt=0;const seen=new Set();
 const build=cyc=>{let poly=[],v=[];for(const [e,from] of cyc){const l=segs[e],fw=ek[e][0]===from;let sm=samples(l);if(!fw)sm=sm.reverse();
   v.push(fw?[l.x1,l.y1]:[l.x2,l.y2]);for(let i=0;i<sm.length-1;i++)poly.push(sm[i])}
  /* একই লাইনের দুই টুকরোর জোড়ার বিন্দু কোণা নয় — বাদ */
  const n=cyc.length;v=v.filter((_,k)=>segs[cyc[k][0]].li!==segs[cyc[(k+n-1)%n][0]].li);return{poly,v}};
 for(const s0 of Object.keys(adj)){const used=new Set(),vis=new Set([s0]),stack=[];
  (function dfs(v){
   for(const [e,o] of adj[v]){if(cnt>3000)return;if(used.has(e))continue;
    if(o===s0&&stack.length>=1){const cyc=[...stack,[e,v]];const k=cyc.map(x=>x[0]).sort((p,q)=>p-q).join(',');
     if(!seen.has(k)){seen.add(k);cnt++;const r=build(cyc);if(cycArea(r.poly)>1)best.push({cyc,poly:r.poly,v:r.v})}continue}
    if(vis.has(o))continue;
    used.add(e);vis.add(o);stack.push([e,v]);dfs(o);stack.pop();vis.delete(o);used.delete(e)}
  })(s0)}
 return best}
/* লাইন পুরোপুরি প্লটের ভেতরে কি না (তিনটি বিন্দু পরীক্ষা) */
function within(l,poly){const q=samples(l,4);return inside(q[1],poly)&&inside(q[2],poly)&&inside(q[3],poly)}
/* লাইনের উপর (প্রান্ত ছাড়া) অন্য লাইনের প্রান্ত বসলে সেই লাইনকে ওই বিন্দুতে ভেঙে টুকরো করা (T-জোড়া) */
function nearOn(l,q){const a=arcInfo(l);
 if(!a){const dx=l.x2-l.x1,dy=l.y2-l.y1,t=Math.max(0,Math.min(1,((q[0]-l.x1)*dx+(q[1]-l.y1)*dy)/(dx*dx+dy*dy||1)));
  const pt=[l.x1+t*dx,l.y1+t*dy];return{t,pt,d:Math.hypot(q[0]-pt[0],q[1]-pt[1])}}
 const ang=Math.atan2(q[1]-a.Cy,q[0]-a.Cx),rel=(((ang-a.a0)*a.dir)%T2+T2)%T2;
 if(rel<=a.sw){const pt=[a.Cx+a.R*Math.cos(ang),a.Cy+a.R*Math.sin(ang)];return{t:rel/a.sw,pt,d:Math.abs(Math.hypot(q[0]-a.Cx,q[1]-a.Cy)-a.R)}}
 const d1=Math.hypot(q[0]-l.x1,q[1]-l.y1),d2=Math.hypot(q[0]-l.x2,q[1]-l.y2);
 return d1<=d2?{t:0,pt:[l.x1,l.y1],d:d1}:{t:1,pt:[l.x2,l.y2],d:d2}}
function splitSegs(tol){const out=[];
 lines.forEach((l,li)=>{if(l.inner)return;const a=arcInfo(l),cuts=[];
  for(let j=0;j<lines.length;j++){if(j===li||lines[j].inner)continue;const m=lines[j];
   for(const q of [[m.x1,m.y1],[m.x2,m.y2]]){const r=nearOn(l,q);
    if(r.d<=tol&&r.t>0&&r.t<1&&dist(q,[l.x1,l.y1])>tol&&dist(q,[l.x2,l.y2])>tol&&!cuts.some(c=>vkey(c.p[0],c.p[1])===vkey(q[0],q[1])))cuts.push({t:r.t,p:q})}}
  if(!cuts.length){out.push({x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,s:l.s||0,li});return}
  cuts.sort((p,q)=>p.t-q.t);let prev={t:0,p:[l.x1,l.y1]};
  for(const c of cuts.concat([{t:1,p:[l.x2,l.y2]}])){
   if(dist(prev.p,c.p)<1e-6)continue;
   let s=0;if(a){const th=(c.t-prev.t)*a.sw;s=a.sg*a.R*(1-Math.cos(th/2))}
   out.push({x1:prev.p[0],y1:prev.p[1],x2:c.p[0],y2:c.p[1],s,li});prev=c}});
 return out}
function newPid(used){let n;do{n=Date.now()+Math.floor(Math.random()*1e6)}while(used.has(n)||lines.some(l=>l.plot===n));used.add(n);return n}
function rebuild(again){plots={};dangling=[];
 /* কাছাকাছি প্রান্তগুলো এক বিন্দুতে মিলিয়ে দেওয়া, যাতে ফাঁক না থাকে */
 const reps=[],tol=Math.min(10,12/V.k);
 const rp=(x,y)=>{for(const r of reps)if(Math.hypot(r[0]-x,r[1]-y)<=tol)return r;const r=[x,y];reps.push(r);return r};
 for(const l of lines){const a=rp(l.x1,l.y1);l.x1=a[0];l.y1=a[1];const b=rp(l.x2,l.y2);l.x2=b[0];l.y2=b[1];l.dash=false;l.closes=false}
 const segs=splitSegs(tol);
 const ek=segs.map(l=>[vkey(l.x1,l.y1),vkey(l.x2,l.y2)]);
 const par=segs.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i])),own={};
 ek.forEach((e,i)=>{for(const v of e){if(own[v]===undefined)own[v]=i;else par[f(i)]=f(own[v])}});
 const comps={};segs.forEach((_,i)=>{(comps[f(i)]=comps[f(i)]||[]).push(i)});
 /* প্রতিটি বন্ধ ঘর (যার ভেতরে আর কোনো লাইন নেই) = আলাদা প্লট */
 const faces=[],info=[],open=[];
 for(const c of Object.values(comps)){const lis=[...new Set(c.map(i=>segs[i].li))],mids=c.map(i=>samples(segs[i],2)[1]),fs=[];
  for(const cy of allCycles(c,ek,segs)){const on=new Set(cy.cyc.map(x=>x[0]));let ok=true;
   for(let k=0;k<c.length;k++){if(!on.has(c[k])&&inside(mids[k],cy.poly)){ok=false;break}}
   if(ok){const fc={poly:cy.poly,v:cy.v,lis:[...new Set(cy.cyc.map(x=>segs[x[0]].li))]};fs.push(fc);faces.push(fc)}}
  if(fs.length)info.push({c,lis,fs});else open.push({lis,c})}
 lines.forEach((l,i)=>{if(l.inner)open.push({lis:[i],c:[]})});
 /* প্লটের আইডি: লাইনগুলোর আগের আইডি অনুযায়ী; একই আইডি দুই প্লটে গেলে পরেরটি নতুন আইডি পায় */
 const cand=[];faces.forEach((fc,fi)=>{const cnt={};fc.lis.forEach(i=>{const id=lines[i].plot;cnt[id]=(cnt[id]||0)+1});for(const id in cnt)cand.push({fi,id:+id,n:cnt[id]})});
 cand.sort((a,b)=>b.n-a.n||a.fi-b.fi);
 const used=new Set(),order=[];
 for(const x of cand){if(faces[x.fi].id!==undefined||used.has(x.id))continue;faces[x.fi].id=x.id;used.add(x.id);order.push(x.fi)}
 faces.forEach((fc,fi)=>{if(fc.id===undefined){fc.id=newPid(used);order.push(fi)}});
 const assigned=new Set();
 for(const fi of order){const fc=faces[fi];
  plots[fc.id]={v:fc.v,pts:fc.poly,closed:true,curved:fc.lis.some(i=>lines[i].s)};
  for(const i of fc.lis)if(!assigned.has(i)){lines[i].plot=fc.id;assigned.add(i)}}
 /* ঘরের অংশ নয় এমন লাইন: প্লটের ভেতরে থাকলে ড্যাশ */
 for(const {lis,fs} of info)for(const i of lis){if(assigned.has(i))continue;
  const h=fs.find(fc=>within(lines[i],fc.poly));
  if(h){lines[i].dash=true;lines[i].plot=h.id}else lines[i].plot=fs[0].id;assigned.add(i)}
 let redo=false;
 for(const {lis,c} of open){let pid=lines[lis[0]].plot;if(used.has(pid))pid=newPid(used);else used.add(pid);
  for(const i of lis)lines[i].plot=pid;let absorbed=false;
  for(const id in plots){const p=plots[id];if(!p.closed)continue;
   if(lis.every(i=>within(lines[i],p.pts))){for(const i of lis){lines[i].dash=true;lines[i].plot=+id}absorbed=true;break}}
  if(!absorbed){plots[pid]={v:[],pts:[],closed:false,curved:false};

  $('ft').value=l.ft===''?'':toBn(l.ft);$('inc').value=l.inc===''?'':toBn(l.inc);
  pn.value=names[l.plot]||'';pn.placeholder=dispName(l.plot);$('pnl').textContent='প্লটের নাম';$('del').textContent='লাইন মুছুন';fx=$('ft');pt=lineMid(l)}
 else if(m==='plot'){pn.value=names[selPlot]||'';pn.placeholder=dispName(selPlot);$('pnl').textContent='প্লটের নাম';$('del').textContent='প্লট মুছুন';pt=plotNamePos(selPlot)}
 else{const t=texts[selText];if(!t)return;pn.value=t.t;pn.placeholder='যেমন: রাস্তা, পুকুর';$('pnl').textContent='লেখা';$('del').textContent='লেখা মুছুন';pt=[t.x,t.y]}
 sh.classList.add('show');placeSheet();ensureVis(pt);req();setTimeout(()=>{try{fx.focus({preventScroll:true})}catch(_){fx.focus()}},50)}
function closeSheet(){$('sheet').classList.remove('show');$('sheet').style.bottom=''}
function done(){if(sheetMode==='text'&&texts[selText]&&!texts[selText].t)texts.splice(selText,1);
 closeSheet();sel=-1;selPlot=null;selText=-1;save();req()}
$('ok').onclick=()=>{pushH();let pid=null;
 if(sheetMode==='line'){const l=lines[sel];if(l){const f=$('ft').value.trim(),i=$('inc').value.trim();l.ft=f===''?'':String(num(f));l.inc=i===''?'':String(num(i));pid=l.plot}}
 else if(sheetMode==='plot')pid=selPlot;
 else{const t=texts[selText];if(t)t.t=$('pn').value.trim()}
 if(pid!==null){const v=$('pn').value.trim();if(v)names[pid]=v;else delete names[pid]}
 save();done()};
$('later').onclick=done;
$('del').onclick=()=>{pushH();
 if(sheetMode==='line'){if(sel>=0)lines.splice(sel,1)}
 else if(sheetMode==='plot'){if(selPlot!==null){lines=lines.filter(l=>String(l.plot)!==String(selPlot));delete names[selPlot];delete nameP[selPlot]}}
 else{if(selText>=0)texts.splice(selText,1);selText=-1}
 rebuild();save();done()};
$('straight').onclick=()=>{const l=lines[sel];if(!l)return;pushH();l.s=0;rebuild();save();req()};
['ft','inc','pn'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('ok').click()}));

/* ---------- শুরু ---------- */
try{const s=JSON.parse(localStorage.getItem('fieldsketch2')||'null');if(s){lines=s.lines||[];names=s.names||{};nameP=s.nameP||{};texts=s.texts||[];if(s.V)V=s.V;rebuild()}}catch(e){lines=[]}
colors();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{colors();req()})}catch(e){}
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
window.addEventListener('resize',fit);setTimeout(fit,30);
</script>
